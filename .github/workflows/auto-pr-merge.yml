name: Validate and create pull request

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'codex/**'
      - 'claude/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Create or update PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/', '')}`;
            const base = 'main';
            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
            });

            let pullRequest = openPulls[0];
            if (!pullRequest) {
              const { data } = await github.rest.pulls.create({
                owner,
                repo,
                head: context.ref.replace('refs/heads/', ''),
                base,
                title: `Atualização automática: ${context.ref.replace('refs/heads/', '')}`,
                body: [
                  'PR criado automaticamente após validação local no GitHub Actions.',
                  '',
                  `Commit validado: ${context.sha}`,
                  'Validações: lint, testes e build.',
                  'Após o merge, o deploy no Base44 continua manual.',
                ].join('\n'),
              });
              pullRequest = data;
            }

            core.info(`PR pronto para revisão: ${pullRequest.html_url}`);
