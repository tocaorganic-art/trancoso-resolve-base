hatsAppConnectButton", "UserJourneyViz", "investors.test", "LeadPrestadorForm.test", "MultilingualAutocomplete", "LeadCaptureForm.test", "ServicoLocalPage", "alert-dialog", "avatar", "drawer", "slider", "toggle-group", "validators", "BadgeEmVerificacao", "VerificarIdentidadeModal", "WhatsAppCallButton.test"], "funcoes_por_linhas": [{"f": "mercadoPagoWebhook", "l": 730}, {"f": "asaasWebhook", "l": 604}, {"f": "createSubscriptionCheckout", "l": 569}, {"f": "analisarDocumento", "l": 402}, {"f": "verificarAntecedentes", "l": 307}, {"f": "cancelarAssinatura", "l": 258}, {"f": "criarPagamentoServico", "l": 248}, {"f": "googleAdsManager", "l": 230}, {"f": "atendimento_chat_ia", "l": 221}, {"f": "atendimento_whatsapp_ia", "l": 204}], "entidades": 53}};
const TYPES = { entity:'Entidade', function:'Função', page:'Página', component:'Componente', test:'Teste', lib:'Lib', doc:'Documento' };
const COLOR = { entity:'#e8571a', function:'#3fb950', page:'#58a6ff', component:'#bc8cff', test:'#d29922', lib:'#39c5cf', doc:'#8b949e' };
const active = new Set(Object.keys(TYPES));
const nodes = DATA.nodes.map((n,i)=>({ ...n, x: Math.cos(i*2.399)*Math.sqrt(i+1)*26+960, y: Math.sin(i*2.399)*Math.sqrt(i+1)*26+520, vx:0, vy:0, r: n.type==='entity'?6:n.type==='function'?5:n.type==='page'?4.5:3.6 }));
const byId = new Map(nodes.map(n=>[n.id,n]));
const edges = DATA.edges.filter(e=>byId.has(e.source)&&byId.has(e.target)).map(e=>({ ...e, s:byId.get(e.source), t:byId.get(e.target) }));

document.getElementById('meta').textContent = DATA.stats.total_nodes + ' nós, ' + DATA.stats.total_edges + ' conexões';
const filters = document.getElementById('filters');
Object.keys(TYPES).forEach(t=>{
  const lab = document.createElement('label'); lab.className='chk';
  lab.innerHTML = '<input type="checkbox" checked data-type="'+t+'"><span class="dot" style="background:'+COLOR[t]+'"></span>'+TYPES[t]+' ('+(DATA.stats.by_type[t]||0)+')';
  lab.querySelector('input').addEventListener('change', ev=>{ ev.target.checked ? active.add(t) : active.delete(t); });
  filters.appendChild(lab);
});

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W=0,H=0, dpr=Math.min(window.devicePixelRatio||1,2), zoom=1, camX=0, camY=0, selected=null, hover=null;
function resize(){ const r=canvas.parentElement.getBoundingClientRect(); W=r.width; H=r.height; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
window.addEventListener('resize', resize); resize();

let ticks=0;
function step(){
  for(const n of nodes){ n.fx=0; n.fy=0; }
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j]; let dx=b.x-a.x, dy=b.y-a.y; let d2=dx*dx+dy*dy || 1;
      if(d2>160000) continue;
      const f=900/d2, fx=dx*Math.sqrt(f), fy=dy*Math.sqrt(f);
      a.fx-=fx; a.fy-=fy; b.fx+=fx; b.fy+=fy;
    }
  }
  for(const e of edges){
    const dx=e.t.x-e.s.x, dy=e.t.y-e.s.y, d=Math.hypot(dx,dy)||1, k=(d-110)*0.012;
    const fx=dx/d*k, fy=dy/d*k;
    e.s.fx+=fx; e.s.fy+=fy; e.t.fx-=fx; e.t.fy-=fy;
  }
  for(const n of nodes){ n.fx += (960-n.x)*0.0016; n.fy += (520-n.y)*0.0016; n.vx=(n.vx+n.fx)*0.82; n.vy=(n.vy+n.fy)*0.82; n.x+=n.vx; n.y+=n.vy; }
  ticks++;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2-camX*zoom, H/2-camY*zoom); ctx.scale(zoom,zoom);
  ctx.lineWidth=0.5; ctx.strokeStyle='rgba(139,148,158,0.18)';
  ctx.beginPath();
  for(const e of edges){ if(!active.has(e.s.type)||!active.has(e.t.type)) continue; ctx.moveTo(e.s.x,e.s.y); ctx.lineTo(e.t.x,e.t.y); }
  ctx.stroke();
  for(const n of nodes){
    if(!active.has(n.type)) continue;
    const isSel = selected===n, isHov = hover===n;
    ctx.beginPath(); ctx.arc(n.x,n.y, n.r*(isSel?2.1:isHov?1.6:1), 0, Math.PI*2);
    ctx.fillStyle = COLOR[n.type]; ctx.fill();
    if(isSel){ ctx.strokeStyle='#e6edf3'; ctx.lineWidth=1.6; ctx.stroke(); }
  }
  ctx.restore();
  if(ticks<260 || zooms.dirty){ zooms.dirty=false; }
}

function tick(){ if(ticks<3000){ step(); draw(); requestAnimationFrame(tick); } }
const zooms={dirty:false};

function screenToWorld(sx,sy){ return { x:(sx-W/2)/zoom+camX, y:(sy-H/2)/zoom+camY }; }
function pick(sx,sy){
  const p=screenToWorld(sx,sy); let best=null, bd=1e9;
  for(const n of nodes){ if(!active.has(n.type)) continue; const d=Math.hypot(n.x-p.x,n.y-p.y); if(d<Math.max(9,n.r*2.4) && d<bd){ bd=d; best=n; } }
  return best;
}
canvas.addEventListener('mousemove', ev=>{
  const r=canvas.getBoundingClientRect(); hover=pick(ev.clientX-r.left, ev.clientY-r.top);
  canvas.style.cursor = hover?'pointer':'grab';
});
canvas.addEventListener('click', ev=>{
  const r=canvas.getBoundingClientRect(); const n=pick(ev.clientX-r.left, ev.clientY-r.top);
  selected=n; show(n); draw();
});
let dragging=false, last={x:0,y:0};
canvas.addEventListener('mousedown', ev=>{ dragging=true; last={x:ev.clientX,y:ev.clientY}; });
window.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mousemove', ev=>{ if(!dragging) return; camX-=(ev.clientX-last.x)/zoom; camY-=(ev.clientY-last.y)/zoom; last={x:ev.clientX,y:ev.clientY}; zooms.dirty=true; draw(); });
canvas.addEventListener('wheel', ev=>{ ev.preventDefault(); zoom=Math.min(4,Math.max(0.25,zoom*(ev.deltaY<0?1.1:0.9))); zooms.dirty=true; draw(); }, {passive:false});
document.getElementById('q').addEventListener('input', ev=>{
  const q=ev.target.value.trim().toLowerCase();
  if(!q) return;
  const n=nodes.find(x=>x.label.toLowerCase().includes(q));
  if(n){ selected=n; show(n); camX=n.x; camY=n.y; zoom=1.5; zooms.dirty=true; draw(); }
});

function show(n){
  const box=document.getElementById('detail');
  if(!n){ box.innerHTML='<h2>Detalhe</h2><p class="muted">Clique em um nó para ver as conexões.</p>'; return; }
  const outs=edges.filter(e=>e.s===n), ins=edges.filter(e=>e.t===n);
  const li=(arr)=>arr.length?arr.map(e=>'<li>'+e.t.label+' <span class="muted">('+e.kind+')</span></li>').join(''):'<li class="muted">nenhuma</li>';
  const liIn=(arr)=>arr.length?arr.map(e=>'<li>'+e.s.label+' <span class="muted">('+e.kind+')</span></li>').join(''):'<li class="muted">nenhuma</li>';
  box.innerHTML='<h2>Detalhe</h2>'
    +'<p style="margin:0 0 6px;font-weight:700;font-size:14px;word-break:break-word">'+n.label+'</p>'
    +'<p><span class="pill" style="border-color:'+COLOR[n.type]+';color:'+COLOR[n.type]+'">'+TYPES[n.type]+'</span></p>'
    + (n.file? '<p class="muted" style="word-break:break-all">'+n.file+'</p>':'')
    + (n.fields!==undefined? '<p class="muted">'+n.fields+' campos</p>':'')
    + (n.lines!==undefined? '<p class="muted">'+n.lines+' linhas</p>':'')
    +'<h2 style="margin-top:16px">Aponta para ('+outs.length+')</h2><ul>'+li(outs)+'</ul>'
    +'<h2 style="margin-top:16px">Recebe de ('+ins.length+')</h2><ul>'+liIn(ins)+'</ul>';
}

tick();
</script>
